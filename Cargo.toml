[workspace]
resolver = "2"
members = ["crates/daygrid", "apps/desktop"]
default-members = ["crates/daygrid"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kobewl/daygrid"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true

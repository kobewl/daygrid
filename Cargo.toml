[workspace]
resolver = "2"
members = ["crates/daygrid", "apps/desktop"]
default-members = ["crates/daygrid"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/kobewl/daygrid"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order：改写用户的 MCP 配置时保持其他条目的原有顺序。
# 需要稳定序列化的地方（幂等摘要）使用 store::canonical，不依赖映射的默认排序。
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
strip = true

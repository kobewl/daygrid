name: CI
on: [push, pull_request]
permissions:
  contents: read

# 同一分支上新的推送会取消还在跑的旧检查，省下排队时间。
# 打标签触发的是 Release 工作流，这里不受影响。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-
      - run: pnpm install --frozen-lockfile
      # 版本号分散在多个文件里，漏改一处不会编译失败，所以每次都检查。
      - run: node scripts/check-version.mjs
      - run: cargo fmt --all -- --check
      - run: pnpm prepare:sidecars
      - run: pnpm --filter @daygrid/ui build
      - name: 日期与跨日回归测试
        run: pnpm --filter @daygrid/ui test
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p daygrid --locked --example mcp-smoke
      # 普通 CI 不读取发布密钥；只验证应用能构建。
      - name: 构建应用（不生成更新签名）
        run: |
          pnpm build --config '{"bundle":{"createUpdaterArtifacts":false}}'
